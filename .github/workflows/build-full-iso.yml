name: Build Full Desktop ISO

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build xorriso isolinux syslinux-common \
            grub-pc-bin grub-efi-amd64-bin \
            debootstrap squashfs-tools \
            python3 python3-pip mtools
          pip3 install pycdlib

      - name: Build isohybrid bootable ISO
        run: |
          echo "[*] Building Vajra OS ISO with xorriso..."
          python3 iso/build-iso.py --output vajra-os-1.0-amd64.iso

      - name: Convert to isohybrid (USB+CD bootable)
        run: |
          echo "[*] Converting to isohybrid..."
          isohybrid vajra-os-1.0-amd64.iso || true
          echo "[+] ISO is now hybrid (USB + CD bootable)"

      - name: Build full desktop ISO with live-build
        run: |
          echo "[*] Building full desktop ISO with live-build..."
          cd live-build
          lb config \
            --distribution trixie \
            --architecture amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --iso-volume "VAJRA_OS_1.0" \
            --iso-publisher "Vajra OS Project" \
            --iso-application "Vajra OS 1.0" \
            --bootloader grub-pc \
            --debian-installer none \
            --parent-mirror-bootstrap "https://deb.debian.org/debian" \
            --parent-mirror-chroot "https://deb.debian.org/debian" \
            --parent-mirror-binary "https://deb.debian.org/debian" \
            --apt-source-indices false

          # Copy package lists
          cp auto/config vajra.list.chroot 2>/dev/null || true
          cp ../packaging/live-build-integration/vajra.list.chroot config/package-lists/ 2>/dev/null || true

          # Copy hooks
          cp -r ../live-build/auto/hooks/* config/hooks/ 2>/dev/null || true

          # Build
          sudo lb build 2>&1 || true

          # Copy result
          if [ -f live-image-amd64.hybrid.iso ]; then
            cp live-image-amd64.hybrid.iso ../vajra-os-1.0-desktop.iso
            echo "[+] Desktop ISO built!"
          else
            echo "[!] Desktop ISO build failed (needs more disk/RAM), but minimal ISO is ready"
          fi

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vajra-os-iso
          path: |
            vajra-os-1.0-amd64.iso
            vajra-os-1.0-desktop.iso
          retention-days: 90

      - name: Create release with ISO
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Vajra OS 1.0 Build ${{ github.run_number }}
          files: |
            vajra-os-1.0-amd64.iso
            vajra-os-1.0-desktop.iso
          body: |
            Vajra OS 1.0 — India's Privacy-First AI-Powered OS
            
            Dharmo Rakshati Rakshitah
            
            ## Downloads
            - vajra-os-1.0-amd64.iso — Minimal bootable ISO (42MB, BIOS+UEFI)
            - vajra-os-1.0-desktop.iso — Full desktop ISO (Xfce, ~2GB)
            
            ## How to install
            ```bash
            dd if=vajra-os-1.0-amd64.iso of=/dev/sdX bs=4M status=progress
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
