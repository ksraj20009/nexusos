name: Create Vajra OS Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip gnupg2

      - name: Download and build packages
        run: |
          mkdir -p packages
          # Download core tools from repo
          for tool in vajra-process-manager.py vajra-memory-manager.py vajra-filesystem-manager.py \
                      vajra-device-manager.py vajra-service-manager.py vajra-user-session-manager.py \
                      vajra-security-center.py vajra-control-center.py vajra-package-manager.py \
                      vajra-update-manager.py vajra-boot-manager.sh vajra-display-server.sh; do
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/core/${tool}" -o "/tmp/${tool}" || true
          done
          # Build packages using the rebuild script
          python3 /workspace/notes/rebuild_all_debs.py || true

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "Vajra OS 1.0 — India's Privacy-First AI-Powered OS"
          body: |
            # वज्र OS — Vajra OS 1.0

            **India's Privacy-First, AI-Powered Operating System**

            धर्मो रक्षति रक्षितः · Dharmo Rakshati Rakshitah

            ## Features
            - Privacy First — No tracking, no telemetry, Tor integration
            - Buddhi AI (बुद्धि) — Built-in AI assistant, runs locally
            - Indian at Core — GST, Panchang, Vedic math, Ayurveda, IRCTC
            - Beginner & Pro Modes — Safety guardrails for beginners
            - 10 Indian Languages — Hindi, Tamil, Bengali, Gujarati, Punjabi, Kannada, Telugu, Malayalam, Marathi, Sanskrit
            - Cybersecurity Tools — Pentesting with ethical usage guides
            - 293+ Commands — 16 core tools + 279 utility scripts + BusyBox 396 applets

            ## Download
            - ISO: 42 MB, bootable on BIOS + UEFI
            - Docker: importable rootfs
            - APT repo: https://ksraj20009.github.io/vajra-os/apt-repo

            ## Install
            ```bash
            curl -fsSL https://ksraj20009.github.io/vajra-os/apt-repo/vajra-archive-keyring.asc | gpg --dearmor -o /usr/share/keyrings/vajra-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/vajra-archive-keyring.gpg] https://ksraj20009.github.io/vajra-os/apt-repo vajra main" | sudo tee /etc/apt/sources.list.d/vajra.list
            sudo apt update
            sudo apt install vajra-core vajra-buddhi-ai vajra-security-center
            ```

            Made in India · MIT License
          draft: false
          prerelease: false
          files: |
            packaging/keys/vajra-archive-keyring.asc
