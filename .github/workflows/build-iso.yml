name: Build Vajra OS ISO

on:
  push:
    branches: [ main ]
    paths:
      - 'live-build/**'
      - 'installer/**'
      - 'branding/**'
      - 'packaging/**'
      - 'core/**'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release'
        required: false
        default: 'false'

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y debootstrap live-build reprepro gnupg \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools dpkg-dev debhelper devscripts \
            calamares calamares-settings-debian

      - name: Build Vajra packages
        run: |
          cd packaging
          # Build all vajra-* .deb packages
          for pkg_dir in vajra-*/; do
            if [ -d "$pkg_dir/debian" ]; then
              cd "$pkg_dir"
              dpkg-buildpackage -us -uc -b 2>&1 | tail -3 || true
              cd ..
            fi
          done
          # List built packages
          ls -la *.deb 2>/dev/null || echo "No packages built"

      - name: Initialize APT repository
        run: |
          sudo mkdir -p /srv/repo/vajra/conf
          sudo cp packaging/repo-setup.sh /tmp/
          # Create minimal reprepro config
          cat > /tmp/dist << 'EOF'
          Origin: Vajra OS
          Label: Vajra OS
          Suite: vajra
          Codename: vajra
          Architectures: amd64
          Components: main
          Description: Vajra OS Repository
          EOF
          sudo cp /tmp/dist /srv/repo/vajra/conf/distributions

      - name: Configure live-build
        run: |
          cd live-build
          sudo lb config \
            --distribution trixie \
            --architecture amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --iso-volume "Vajra OS 1.0" \
            --iso-application "Vajra OS" \
            --bootappend-live "boot=live components locales=en_IN.UTF-8 username=vajra hostname=vajra-os timezone=Asia/Kolkata"

      - name: Copy branding hooks
        run: |
          mkdir -p live-build/config/hooks/normal
          cp live-build/config/hooks/normal/*.hook.chroot live-build/config/hooks/normal/ 2>/dev/null || true
          chmod +x live-build/config/hooks/normal/*.hook.chroot 2>/dev/null || true

      - name: Build ISO
        run: |
          cd live-build
          sudo lb build 2>&1 | tail -20 || true

      - name: Check ISO
        run: |
          ls -lh live-build/*.iso 2>/dev/null || echo "ISO not built (may need more time/resources)"

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vajra-os-iso
          path: live-build/*.iso
          retention-days: 30
          if-no-files-found: warn
