# Vajra OS Xorg Configuration
Section "Device"
    Identifier "Vajra Default"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
EndSection

Section "Screen"
    Identifier "Default Screen"
    Device "Vajra Default"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080" "1280x720" "1024x768"
    EndSubSection
EndSection

Section "InputClass"
    Identifier "Keyboard Defaults"
    MatchIsKeyboard "yes"
    Option "XkbLayout" "us"
    Option "XkbOptions" "grp:super_space_toggle,grp_led:caps"
EndSection
