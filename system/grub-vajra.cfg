# =============================================================
# Vajra OS — GRUB Bootloader Configuration
# Vajra (वज्र) — Thunderbolt-strong, unbreakable OS
# =============================================================

# --- Timeout and appearance ---
set timeout=5
set timeout_style=menu
set default=0

# --- Vajra theme ---
insmod all_video
insmod gfxterm
insmod png
insmod part_gpt
insmod part_msdos
insmod ext2

set gfxmode=auto
set gfxpayload=keep
terminal_output gfxterm

# Vajra boot colors (deep blue + gold accent — inspired by Indra's vajra)
set menu_color_normal=white/blue
set menu_color_highlight=yellow/blue
set color_normal=light-blue/black
set color_highlight=yellow/black

# Vajra boot message
set vajra_title="VAJRA OS (वज्र)"
set vajra_subtitle="Thunderbolt Strong. Unbreakable."

# --- Menu entries ---

menuentry "Vajra OS (Normal Boot)" --class vajra --class os {
    recordfail
    load_video
    insmod gzio
    echo "Loading Vajra OS kernel..."
    linux /boot/vmlinuz-vajra root=UUID=VAJRA_ROOT_UUID ro quiet splash vajra.boot=normal
    echo "Loading initial ramdisk..."
    initrd /boot/initrd.img-vajra
}

menuentry "Vajra OS (Beginner Mode)" --class vajra --class os {
    recordfail
    echo "Loading Vajra OS in Beginner Mode..."
    linux /boot/vmlinuz-vajra root=UUID=VAJRA_ROOT_UUID ro quiet splash vajra.boot=beginner vajra.sudo=disabled
    initrd /boot/initrd.img-vajra
}

menuentry "Vajra OS (Pro Mode)" --class vajra --class os {
    recordfail
    echo "Loading Vajra OS in Pro Mode..."
    linux /boot/vmlinuz-vajra root=UUID=VAJRA_ROOT_UUID ro quiet vajra.boot=pro vajra.sudo=enabled
    initrd /boot/initrd.img-vajra
}

menuentry "Vajra OS (Recovery Mode)" --class vajra --class os {
    recordfail
    echo "Loading Vajra OS Recovery..."
    linux /boot/vmlinuz-vajra root=UUID=VAJRA_ROOT_UUID ro single vajra.boot=recovery
    initrd /boot/initrd.img-vajra
}

menuentry "Vajra OS (Safe Graphics Mode)" --class vajra --class os {
    recordfail
    echo "Loading Vajra OS with safe graphics..."
    linux /boot/vmlinuz-vajra root=UUID=VAJRA_ROOT_UUID ro quiet splash nomodeset vajra.boot=safe
    initrd /boot/initrd.img-vajra
}

menuentry "Vajra OS Memory Test (Memtest86+)" --class tool {
    insmod linux16
    linux16 /boot/memtest86+.bin
}

menuentry "Vajra OS Live USB" --class vajra --class os {
    echo "Starting Vajra OS from USB..."
    linux /casper/vmlinuz boot=casper quiet splash vajra.boot=live
    initrd /casper/initrd
}

submenu "Advanced Options for Vajra OS" {
    menuentry "Vajra OS (Verbose Boot)" {
        linux /boot/vmlinuz-vajra root=UUID=VAJRA_ROOT_UUID ro vajra.boot=verbose
        initrd /boot/initrd.img-vajra
    }
    menuentry "Vajra OS (Debug Mode)" {
        linux /boot/vmlinuz-vajra root=UUID=VAJRA_ROOT_UUID ro debug vajra.boot=debug
        initrd /boot/initrd.img-vajra
    }
    menuentry "Vajra OS (Fallback GPU)" {
        linux /boot/vmlinuz-vajra root=UUID=VAJRA_ROOT_UUID ro quiet splash nouveau.modeset=0 i915.modeset=0 vajra.boot=fallback
        initrd /boot/initrd.img-vajra
    }
}

# --- GRUB background ---
# To set a background image, uncomment:
# background_image /boot/grub/vajra-grub-bg.png