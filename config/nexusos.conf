# NexusOS System Configuration
# =============================
# This file is read by NexusOS components at runtime

OS_NAME="NexusOS"
OS_VERSION="1.0"
OS_CODENAME="Aurora"
OS_BUILDER="ksraj20009"
OS_LICENSE="MIT"

# Privacy settings
PRIVACY_MODE=true
TELEMETRY=false
TOR_TRANSPARENT_PROXY=true
DNS_ENCRYPTION=true
MAC_RANDOMIZATION=true
FIREWALL_DEFAULT_ZONE=drop

# AI settings
AI_ENABLED=true
AI_API_HOST=127.0.0.1
AI_API_PORT=5210
AI_VOICE=true
AI_LOCAL_LLM=true
AI_LLM_MODEL=llama3.2

# Desktop settings
DESKTOP_ENVIRONMENT=gnome
DESKTOP_SHELL=/opt/nexusos/desktop/nexus-shell.py
DEFAULT_THEME=dark
DEFAULT_BROWSER=firefox

# Network settings
NETWORK_MANAGER=NetworkManager
VPN_KILL_SWITCH=true