# Vajra OS Docker Compose
# Run Vajra OS in Docker container
version: "3.8"
services:
  vajra-desktop:
    image: vajra/os:latest
    container_name: vajra-desktop
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5900:5900"
      - "3389:3389"
    volumes:
      - vajra-home:/home/vajra
      - vajra-config:/etc/vajra
    environment:
      - DISPLAY=:0
      - RESOLUTION=1920x1080
      - VNC_PASSWORD=vajra
      - TZ=Asia/Kolkata
    networks:
      - vajra-net

  vajra-ai:
    image: vajra/ai:latest
    container_name: vajra-ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - vajra-ai-models:/models
    environment:
      - MODEL=buddhi-local
      - LANGUAGE=en-IN
    networks:
      - vajra-net

  vajra-proxy:
    image: nginx:latest
    container_name: vajra-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vajra-desktop
      - vajra-ai
    networks:
      - vajra-net

volumes:
  vajra-home:
  vajra-config:
  vajra-ai-models:

networks:
  vajra-net:
    driver: bridge