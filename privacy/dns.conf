# NexusOS Encrypted DNS Configuration
# ====================================
# DNS-over-HTTPS (DoH) and DNS-over-TLS (DoT)
# Copy to /etc/systemd/resolved.conf

[Resolve]
# Use encrypted DNS resolvers only
DNS=127.0.0.1:5353
FallbackDNS=1.1.1.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net
Domains=~.

# Enable DNS-over-TLS
DNSOverTLS=yes

# Disable plain text DNS
DNSSEC=yes

# Disable LLMNR (Link-Local Multicast Name Resolution)
LLMNR=no

# Disable multicast DNS
MulticastDNS=no

# Cache settings
Cache=yes
CacheFromLocalhost=yes

# Don't use stale cache
ReadEtcHosts=yes