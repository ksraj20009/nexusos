<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Devanagari (Hindi, Marathi, Sanskrit) -->
  <match target="pattern">
    <test name="lang"><string>hi</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>mr</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang"><string>sa</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>
  <!-- Tamil -->
  <match target="pattern">
    <test name="lang"><string>ta</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Tamil</string>
    </edit>
  </match>
  <!-- Bengali -->
  <match target="pattern">
    <test name="lang"><string>bn</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Bengali</string>
    </edit>
  </match>
  <!-- Gujarati -->
  <match target="pattern">
    <test name="lang"><string>gu</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Gujarati</string>
    </edit>
  </match>
  <!-- Punjabi (Gurmukhi) -->
  <match target="pattern">
    <test name="lang"><string>pa</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Gurmukhi</string>
    </edit>
  </match>
  <!-- Kannada -->
  <match target="pattern">
    <test name="lang"><string>kn</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Kannada</string>
    </edit>
  </match>
  <!-- Telugu -->
  <match target="pattern">
    <test name="lang"><string>te</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Telugu</string>
    </edit>
  </match>
  <!-- Malayalam -->
  <match target="pattern">
    <test name="lang"><string>ml</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Malayalam</string>
    </edit>
  </match>
</fontconfig>
