# NexusOS Partitioning Configuration
# ===================================
# Default partition scheme for Calamares

defaultFileSystem: btrfs

# Recommended partition sizes
partitions:
  - name: "EFI System Partition"
    mountPoint: "/boot/efi"
    filesystem: "fat32"
    size: "512MiB"
    type: "efi"
    
  - name: "Root"
    mountPoint: "/"
    filesystem: "btrfs"
    size: "30GiB"
    subvolumes:
      - name: "@"
        mountPoint: "/"
      - name: "@home"
        mountPoint: "/home"
      - name: "@var"
        mountPoint: "/var"
      - name: "@tmp"
        mountPoint: "/tmp"
    
  - name: "Swap"
    filesystem: "swap"
    size: "8GiB"

# LUKS encryption (optional — user chooses during install)
luksOptions:
  cipher: "aes-xts-plain64"
  keySize: 512
  hash: "sha512"
  iterations: 5000