# Calamares Installer Configuration for NexusOS
# =================================================
# This file configures the Calamares graphical installer.
# Copy to /etc/calamares/settings.conf

---
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - packages
    - bootloader
    - postcfg
    - umount
  - show:
    - finished

branding: nexusos
prompt-install: true
dont-chroot: false

# Services to enable after installation
services:
  enabled:
    - NetworkManager
    - gdm
    - tor
    - firewalld
    - apparmor
    - usbguard
    - nexus-ai
    - nexus-tor
  disabled:
    - avahi-daemon
    - cups
    - bluetooth

# Packages to remove after installation
disable:
  - calamares