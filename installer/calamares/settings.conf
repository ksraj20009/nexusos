# ============================================================================
# Vajra OS — Calamares Installer Configuration
# ============================================================================
# This configures the Calamares installer with Vajra OS branding.
# Users see this when they click "Install Vajra OS" on the desktop.
# ============================================================================

---
# Sequence of installer modules (in order)
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - sourcesmedia
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - luksopenswaphook
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - packages
      - umount
  - show:
      - finished

# Branding
branding: vajra

# General settings
general:
  install-donation-url: ""
  help-url: https://vajra-os.org/docs
  help-index: index.html
