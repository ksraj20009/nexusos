# ============================================================================
# Vajra OS — Calamares packages config
# ============================================================================
# Post-install packages that are installed from the Vajra APT repository.
# This ensures the installed system has the same packages as the live ISO.
# ---
packageOperations:
  - install:
      - vajra-core
      - vajra-security-center
      - vajra-control-center
      - vajra-package-manager
      - vajra-update-manager
      - vajra-buddhi-ai
